sources:
  # IA Aplicada - Tier 1
  - id: arxiv-agentic-hci-ma
    name: "arXiv — Agentes autônomos e interação humano-IA"
    axis: ia-aplicada
    tier: 1
    type: arxiv
    url: "http://export.arxiv.org/api/query?search_query=%28cat%3Acs.HC+OR+cat%3Acs.MA%29+AND+%28abs%3A%22agentic%22+OR+abs%3A%22LLM+agent%22%29&sortBy=submittedDate&sortOrder=descending&max_results=30"
    homepage: "https://arxiv.org/list/cs.HC/recent"
    access: open
    latam: false
    rationale: "Fonte primária da pesquisa mundial em agentes que planejam e executam cadeias longas, com o corte cs.HC trazendo delegação, supervisão humana e confiança sistêmica antes de virar prática de mercado."

  - id: mit-sloan-management-review
    name: "MIT Sloan Management Review"
    axis: ia-aplicada
    tier: 1
    type: rss
    url: "https://sloanreview.mit.edu/feed/"
    homepage: "https://sloanreview.mit.edu/"
    access: partial
    latam: false
    rationale: "Periódico de gestão do MIT que publica pesquisa longitudinal com empresas sobre adoção de IA, governança e ROI mensurado."

  - id: bair-berkeley-blog
    name: "Berkeley Artificial Intelligence Research (BAIR) Blog"
    axis: ia-aplicada
    tier: 1
    type: rss
    url: "https://bair.berkeley.edu/blog/feed.xml"
    homepage: "https://bair.berkeley.edu/blog/"
    access: open
    latam: false
    rationale: "Laboratório acadêmico de primeira linha explicando em prosa acessível a arquitetura de agentes de horizonte longo, memória e sistemas construídos para operar com agentes."

  - id: microsoft-research-blog
    name: "Microsoft Research Blog"
    axis: ia-aplicada
    tier: 1
    type: rss
    url: "https://www.microsoft.com/en-us/research/feed/"
    homepage: "https://www.microsoft.com/en-us/research/"
    access: open
    latam: false
    rationale: "Laboratório com produção sustentada sobre agentes de uso de computador, ambientes de avaliação e estudos empíricos de produtividade em trabalho real."

  # IA Aplicada - Tier 2
  - id: ai-normal-technology
    name: "AI as Normal Technology"
    axis: ia-aplicada
    tier: 2
    type: rss
    url: "https://www.normaltech.ai/feed"
    homepage: "https://www.normaltech.ai/"
    access: open
    latam: false
    rationale: "Sucessor do AI Snake Oil, escrito por pesquisadores de Princeton; melhor antídoto contra hype com argumentos rigorosos sobre difusão, agência humana e limites reais de automação."

  - id: one-useful-thing-mollick
    name: "One Useful Thing"
    axis: ia-aplicada
    tier: 2
    type: rss
    url: "https://www.oneusefulthing.org/feed"
    homepage: "https://www.oneusefulthing.org/"
    access: open
    latam: false
    rationale: "Professor da Wharton que testa sistematicamente IA em tarefas organizacionais reais e traduz achados em prática de trabalho."

  - id: benedict-evans-essays
    name: "Benedict Evans — Essays"
    axis: ia-aplicada
    tier: 2
    type: rss
    url: "https://www.ben-evans.com/benedictevans?format=rss"
    homepage: "https://www.ben-evans.com/"
    access: open
    latam: false
    rationale: "Analista de referência em estratégia de plataformas; ensaios densos sobre economia de tokens, exposição de trabalho e como a IA redesenha posicionamento de produto em escala global."

  - id: mit-sloan-review-brasil
    name: "MIT Sloan Management Review Brasil"
    axis: ia-aplicada
    tier: 2
    type: rss
    url: "https://mitsloanreview.com.br/feed/"
    homepage: "https://mitsloanreview.com.br/"
    access: partial
    latam: true
    rationale: "Edição brasileira licenciada do MIT SMR, em pt-BR, com pauta constante sobre liderança em IA, métricas além de redução de carga de trabalho e casos de adoção no contexto corporativo local."

  # IA Aplicada - Tier 3
  - id: import-ai-jack-clark
    name: "Import AI"
    axis: ia-aplicada
    tier: 3
    type: rss
    url: "https://importai.substack.com/feed"
    homepage: "https://importai.substack.com/"
    access: open
    latam: false
    rationale: "Newsletter semanal de sinal comprovado que conecta avanços de capacidade agêntica a implicações de política, governança e risco."

  # Produto & Descoberta - Tier 1
  - id: technovation-journal
    name: "Technovation"
    axis: produto-descoberta
    tier: 1
    type: rss
    url: "https://rss.sciencedirect.com/publication/science/01664972"
    homepage: "https://www.sciencedirect.com/journal/technovation"
    access: partial
    latam: false
    rationale: "Periódico revisado por pares em gestão da inovação e empreendedorismo tecnológico, com evidência empírica sobre criação e apropriação de valor."

  # Produto & Descoberta - Tier 2
  - id: product-talk-teresa-torres
    name: "Product Talk — Teresa Torres"
    axis: produto-descoberta
    tier: 2
    type: rss
    url: "https://www.producttalk.org/feed/"
    homepage: "https://www.producttalk.org/"
    access: open
    latam: false
    rationale: "Fonte canônica de discovery contínuo; publica estudos de caso longos de times reais sobre Opportunity Solution Tree e descoberta contínua."

  - id: svpg-insights
    name: "Silicon Valley Product Group"
    axis: produto-descoberta
    tier: 2
    type: rss
    url: "https://www.svpg.com/feed/"
    homepage: "https://www.svpg.com/insights/"
    access: open
    latam: false
    rationale: "Referência mundial na separação discovery/delivery e em times de produto empoderados; textos densos sobre risco de valor e viabilidade de negócio."

  - id: itamar-gilad
    name: "Itamar Gilad"
    axis: produto-descoberta
    tier: 2
    type: rss
    url: "https://itamargilad.com/feed/"
    homepage: "https://itamargilad.com/"
    access: open
    latam: false
    rationale: "Autor de Evidence-Guided e do framework GIST; trata explicitamente de como transformar hipótese em evidência e evidência em decisão de investimento de produto."

  - id: a-smart-bear-jason-cohen
    name: "A Smart Bear — Jason Cohen"
    axis: produto-descoberta
    tier: 2
    type: rss
    url: "https://longform.asmartbear.com/index.xml"
    homepage: "https://longform.asmartbear.com/"
    access: open
    latam: false
    rationale: "Fundador do WP Engine escrevendo ensaios longos sobre as dores reais de fundadores B2B SaaS — precificação, foco, priorização e crítica a frameworks de decisão como RICE."

  - id: roman-pichler
    name: "Roman Pichler"
    axis: produto-descoberta
    tier: 2
    type: rss
    url: "https://www.romanpichler.com/feed/"
    homepage: "https://www.romanpichler.com/"
    access: open
    latam: false
    rationale: "Autor amplamente citado em estratégia e visão de produto; entrega frameworks reutilizáveis que ligam visão, estratégia, roadmap e backlog."

  - id: joca-torres
    name: "Joca Torres"
    axis: produto-descoberta
    tier: 2
    type: rss
    url: "https://medium.com/feed/@jocatorres"
    homepage: "https://medium.com/@jocatorres"
    access: open
    latam: true
    rationale: "Autor canônico brasileiro de gestão de produtos digitais, escrevendo com cadência semanal sobre discovery no dia a dia, métricas perversas e OKRs no contexto de SaaS."

  # Produto & Descoberta - Tier 3
  - id: the-beautiful-mess-john-cutler
    name: "The Beautiful Mess — John Cutler"
    axis: produto-descoberta
    tier: 3
    type: rss
    url: "https://cutlefish.substack.com/feed"
    homepage: "https://cutlefish.substack.com/"
    access: partial
    latam: false
    rationale: "Leitura sistêmica de por que organizações constroem a coisa errada — fluxo de valor, capacidades e os padrões que corrompem a descoberta."

  - id: the-product-compass
    name: "The Product Compass — Paweł Huryn"
    axis: produto-descoberta
    tier: 3
    type: rss
    url: "https://www.productcompass.pm/feed"
    homepage: "https://www.productcompass.pm/"
    access: partial
    latam: false
    rationale: "Newsletter de alto sinal focada em discovery operacional e PM AI-native, com guias passo a passo e templates aplicáveis."

  - id: latitud-newsletter
    name: "Latitud Newsletter"
    axis: produto-descoberta
    tier: 3
    type: rss
    url: "https://latitudlatam.substack.com/feed"
    homepage: "https://latitudlatam.substack.com/"
    access: open
    latam: true
    rationale: "Braço de conteúdo da Latitud; análise direta das dores de quem constrói SaaS B2B na região com LatAm Tech Report como base de dados."

  # Design & Liderança - Tier 1
  - id: nielsen-norman-group
    name: "Nielsen Norman Group"
    axis: design-lideranca
    tier: 1
    type: rss
    url: "https://www.nngroup.com/feed/rss/"
    homepage: "https://www.nngroup.com/articles/"
    access: open
    latam: false
    rationale: "Instituição de pesquisa em UX mais citada do mundo; publica estudos empíricos próprios sobre IA aplicada a design, mentoria e maturidade de equipes."

  - id: she-ji-journal
    name: "She Ji: The Journal of Design, Economics, and Innovation"
    axis: design-lideranca
    tier: 1
    type: rss
    url: "https://rss.sciencedirect.com/publication/science/24058726"
    homepage: "https://www.journals.elsevier.com/she-ji-the-journal-of-design-economics-and-innovation"
    access: open
    latam: false
    rationale: "Periódico revisado por pares de referência em teoria e filosofia do design; trata design como disciplina de sistemas, poder e futuros."

  - id: infodesign-sbdi
    name: "InfoDesign — Revista Brasileira de Design da Informação"
    axis: design-lideranca
    tier: 1
    type: rss
    url: "https://infodesign.emnuvens.com.br/infodesign/gateway/plugin/WebFeedGatewayPlugin/rss2"
    homepage: "https://infodesign.emnuvens.com.br/infodesign"
    access: open
    latam: true
    rationale: "Único periódico brasileiro revisado por pares de design com continuidade desde 2004; pesquisa nacional sobre LLMs, personas e ergonomia informacional."

  # Design & Liderança - Tier 2
  - id: jakob-nielsen-ux-tigers
    name: "Jakob Nielsen on UX"
    axis: design-lideranca
    tier: 2
    type: rss
    url: "https://jakobnielsenphd.substack.com/feed"
    homepage: "https://jakobnielsenphd.substack.com/"
    access: open
    latam: false
    rationale: "Autor mais citado da usabilidade escrevendo semanalmente sobre a interseção IA×UX — design para agentes e novos paradigmas de interface."

  - id: peter-merholz
    name: "Peter Merholz"
    axis: design-lideranca
    tier: 2
    type: rss
    url: "https://www.petermerholz.com/blog/feed/"
    homepage: "https://www.petermerholz.com/blog/"
    access: open
    latam: false
    rationale: "Coautor de 'Org Design for Design Orgs'; escreve sobre linha de reporte, OKRs e carreira sênior — o eixo de liderança em estado puro."

  - id: cennydd-bowles
    name: "Cennydd Bowles"
    axis: design-lideranca
    tier: 2
    type: rss
    url: "https://cennydd.com/writing?format=rss"
    homepage: "https://cennydd.com/writing"
    access: open
    latam: false
    rationale: "Autor de 'Future Ethics' e doutorando em filosofia sobre engano e manipulação em design; voz mais rigorosa em design ético e value-sensitive design."

  - id: behavioral-scientist
    name: "Behavioral Scientist"
    axis: design-lideranca
    tier: 2
    type: rss
    url: "https://behavioralscientist.org/feed/"
    homepage: "https://behavioralscientist.org/"
    access: open
    latam: false
    rationale: "Publicação sem fins lucrativos editada por pesquisadores; traduz psicologia do usuário e limites do 'nudge' com rigor de evidência."

  - id: jorge-arango
    name: "Jorge Arango"
    axis: design-lideranca
    tier: 2
    type: atom
    url: "https://jarango.com/feed/"
    homepage: "https://jarango.com/"
    access: open
    latam: false
    rationale: "Coautor do 'polar bear book'; combina arquitetura de informação, sistemas e o podcast Traction Heroes sobre agência e liderança."

  - id: the-convivial-society
    name: "The Convivial Society"
    axis: design-lideranca
    tier: 2
    type: rss
    url: "https://theconvivialsociety.substack.com/feed"
    homepage: "https://theconvivialsociety.substack.com/"
    access: partial
    latam: false
    rationale: "L. M. Sacasas na linhagem Illich/Ellul/Postman — crítica filosófica da tecnologia; ensaios longos sobre atenção, mediação e o que a IA faz com a experiência humana."

  # Design & Liderança - Tier 3
  - id: ux-collective-brasil
    name: "UX Collective 🇧🇷"
    axis: design-lideranca
    tier: 3
    type: rss
    url: "https://brasil.uxdesign.cc/feed"
    homepage: "https://brasil.uxdesign.cc/"
    access: partial
    latam: true
    rationale: "Braço em português do UX Collective, com curadoria dos mesmos editores; melhor concentração de escrita crítica em português sobre design especulativo e IA na prática."

  # Acessibilidade - Tier 1
  - id: w3c-wai-news
    name: "W3C Web Accessibility Initiative"
    axis: acessibilidade
    tier: 1
    type: atom
    url: "https://www.w3.org/WAI/feed.xml"
    homepage: "https://www.w3.org/WAI/"
    access: open
    latam: false
    rationale: "Fonte normativa primária do WCAG/ARIA/ATAG — anuncia drafts, notas e publicações antes de qualquer intermediário."

  - id: webaim-blog
    name: "WebAIM"
    axis: acessibilidade
    tier: 1
    type: rss
    url: "https://webaim.org/blog/feed"
    homepage: "https://webaim.org/blog/"
    access: open
    latam: false
    rationale: "Centro institucional por trás do WebAIM Million e do Contrast Checker; análise sóbria de conformidade, regulação e dados de campo."

  # Acessibilidade - Tier 2
  - id: tetralogical
    name: "TetraLogical"
    axis: acessibilidade
    tier: 2
    type: atom
    url: "https://tetralogical.com/feed.xml"
    homepage: "https://tetralogical.com/blog/"
    access: open
    latam: false
    rationale: "Consultoria de Léonie Watson; textos curtos e densos sobre semântica, apps nativos e leitura crítica das guidelines."

  - id: deque-blog
    name: "Deque Systems"
    axis: acessibilidade
    tier: 2
    type: rss
    url: "https://www.deque.com/feed/"
    homepage: "https://www.deque.com/blog/"
    access: open
    latam: false
    rationale: "Criadora do axe-core; publica shift-left, integração em CI/CD e estratégia de programa de a11y em escala."

  - id: level-access
    name: "Level Access"
    axis: acessibilidade
    tier: 2
    type: rss
    url: "https://www.levelaccess.com/feed/"
    homepage: "https://www.levelaccess.com/blog/"
    access: open
    latam: false
    rationale: "Maior consultoria enterprise de a11y; cobre maturidade de programa, risco jurídico e o caso de negócio que sustenta conversão."

  - id: adrian-roselli
    name: "Adrian Roselli"
    axis: acessibilidade
    tier: 2
    type: rss
    url: "https://adrianroselli.com/feed"
    homepage: "https://adrianroselli.com/"
    access: open
    latam: false
    rationale: "Referência técnica máxima da comunidade; deep-dives verificados sobre ARIA, componentes e recursos novos da plataforma."

  - id: eric-eggert-yatil
    name: "Eric Eggert (yatil)"
    axis: acessibilidade
    tier: 2
    type: rss
    url: "https://yatil.net/feed.xml"
    homepage: "https://yatil.net/"
    access: open
    latam: false
    rationale: "Ex-W3C/WAI, autor de material oficial de WCAG; escreve sobre como ler e aplicar as guidelines na prática profissional."

  - id: equal-entry
    name: "Equal Entry"
    axis: acessibilidade
    tier: 2
    type: rss
    url: "https://equalentry.com/feed/"
    homepage: "https://equalentry.com/"
    access: open
    latam: false
    rationale: "Consultoria com forte cobertura de testes por jornada de usuário em casos reais — elo direto entre a11y e conversão."

  - id: reinaldo-ferraz
    name: "Reinaldo Ferraz"
    axis: acessibilidade
    tier: 2
    type: rss
    url: "https://reinaldoferraz.com.br/feed/"
    homepage: "https://reinaldoferraz.com.br/"
    access: open
    latam: true
    rationale: "Especialista do Ceweb.br/W3C Brasil; cobre WCAG, ABNT NBR 17225 e o contexto normativo brasileiro com profundidade técnica."

  # Acessibilidade - Tier 3
  - id: craig-abbott
    name: "Craig Abbott"
    axis: acessibilidade
    tier: 3
    type: atom
    url: "https://www.craigabbott.co.uk/feed.xml"
    homepage: "https://www.craigabbott.co.uk/blog/"
    access: open
    latam: false
    rationale: "Head of Accessibility em governo digital do Reino Unido; escreve sobre embutir a11y em design systems, CSS e processo."

  - id: accessibility-weekly
    name: "Accessibility Weekly"
    axis: acessibilidade
    tier: 3
    type: atom
    url: "https://a11yweekly.com/feed"
    homepage: "https://a11yweekly.com/"
    access: open
    latam: false
    rationale: "Newsletter curada por David A. Kennedy, ativa há mais de uma década; agrega o que a comunidade a11y considera relevante na semana."

  # Branding & Tendências - Tier 1
  - id: kellogg-insight
    name: "Kellogg Insight"
    axis: branding-tendencias
    tier: 1
    type: rss
    url: "https://insight.kellogg.northwestern.edu/feed/rss"
    homepage: "https://insight.kellogg.northwestern.edu/"
    access: open
    latam: false
    rationale: "Braço editorial da Kellogg, berço da disciplina moderna de marketing; publicando pesquisa peer-reviewed destilada em implicações estratégicas."

  - id: knowledge-at-wharton
    name: "Knowledge at Wharton"
    axis: branding-tendencias
    tier: 1
    type: rss
    url: "https://knowledge.wharton.upenn.edu/feed/"
    homepage: "https://knowledge.wharton.upenn.edu/"
    access: open
    latam: false
    rationale: "Journal de negócios da Wharton com pesquisa de marketing e estratégia de crescimento revisada por pares, aberta e sem paywall."

  # Branding & Tendências - Tier 2
  - id: prophet
    name: "Prophet"
    axis: branding-tendencias
    tier: 2
    type: rss
    url: "https://prophet.com/feed/"
    homepage: "https://prophet.com/"
    access: open
    latam: false
    rationale: "Consultoria global de crescimento fundada na tradição de David Aaker, com pesquisa proprietária sobre relevância, propósito e transformação de marca."

  - id: siegel-gale
    name: "Siegel+Gale"
    axis: branding-tendencias
    tier: 2
    type: rss
    url: "https://www.siegelgale.com/feed/"
    homepage: "https://www.siegelgale.com/"
    access: open
    latam: false
    rationale: "Consultoria de branding com estudo longitudinal proprietário ligando clareza de marca a preferência, preço e receita."

  - id: vivaldi-group
    name: "Vivaldi Group"
    axis: branding-tendencias
    tier: 2
    type: rss
    url: "https://vivaldigroup.com/feed/"
    homepage: "https://vivaldigroup.com/"
    access: open
    latam: false
    rationale: "Consultoria de Erich Joachimsthaler publicando frameworks proprietários como Demand Spaces — estratégia de marca ligada a demanda e go-to-market."

  # Branding & Tendências - Tier 3
  - id: branding-strategy-insider
    name: "Branding Strategy Insider"
    axis: branding-tendencias
    tier: 3
    type: rss
    url: "https://brandingstrategyinsider.com/feed/"
    homepage: "https://brandingstrategyinsider.com/"
    access: open
    latam: false
    rationale: "Publicação focada exclusivamente em estratégia e posicionamento de marca, com cadência diária e ensaios acionáveis."

  - id: mkt1-newsletter
    name: "MKT1 Newsletter"
    axis: branding-tendencias
    tier: 3
    type: rss
    url: "https://newsletter.mkt1.co/feed"
    homepage: "https://newsletter.mkt1.co/"
    access: partial
    latam: false
    rationale: "Newsletter de sinal comprovado sobre go-to-market e posicionamento em B2B, com frameworks operacionais de quem construiu marketing em Asana e Carta."

  - id: ana-couto
    name: "Ana Couto"
    axis: branding-tendencias
    tier: 3
    type: rss
    url: "https://anacouto.com.br/feed/"
    homepage: "https://anacouto.com.br/"
    access: open
    latam: true
    rationale: "Maior referência brasileira em branding, com método proprietário aplicado em O Boticário e Livelo; publica sobre consistência de marca, relevância e crescimento."

  # Macro & Capital - Tier 1
  - id: bis-publications
    name: "BIS — Bank for International Settlements"
    axis: macro-capital
    tier: 1
    type: rss
    url: "https://www.bis.org/doclist/bis_fsi_publs.rss"
    homepage: "https://www.bis.org/"
    access: open
    latam: false
    rationale: "O banco central dos bancos centrais publica papers que definem o enquadramento macro-financeiro global — incluindo IA na economia e crédito não-bancário."

  - id: ny-fed-liberty-street-economics
    name: "Liberty Street Economics — Federal Reserve Bank of New York"
    axis: macro-capital
    tier: 1
    type: rss
    url: "https://libertystreeteconomics.newyorkfed.org/feed/"
    homepage: "https://libertystreeteconomics.newyorkfed.org/"
    access: open
    latam: false
    rationale: "Blog de pesquisa do Fed de Nova York que traduz dados primários de crédito, juros e liquidez em análise curta."

  - id: lavca
    name: "LAVCA — Association for Private Capital Investment in Latin America"
    axis: macro-capital
    tier: 1
    type: rss
    url: "https://www.lavca.org/feed/"
    homepage: "https://www.lavca.org/"
    access: partial
    latam: true
    rationale: "Associação de referência do capital privado latino-americano, com base de dados proprietária de rodadas, fundos e saídas."

  # Macro & Capital - Tier 2
  - id: a16z
    name: "a16z — Andreessen Horowitz"
    axis: macro-capital
    tier: 2
    type: rss
    url: "https://www.a16z.news/feed"
    homepage: "https://a16z.com/"
    access: open
    latam: false
    rationale: "Research aberto da maior firma de VC dos EUA sobre teses de investimento e benchmarks de adoção de IA."

  - id: crunchbase-news
    name: "Crunchbase News"
    axis: macro-capital
    tier: 2
    type: rss
    url: "https://news.crunchbase.com/feed/"
    homepage: "https://news.crunchbase.com/"
    access: open
    latam: false
    rationale: "Jornalismo movido pela base de dados da Crunchbase: volumes de funding por estágio e setor, concentração em IA e comportamento de seed/Série A."

  - id: brazil-journal
    name: "Brazil Journal"
    axis: macro-capital
    tier: 2
    type: rss
    url: "https://braziljournal.com/rss"
    homepage: "https://braziljournal.com/"
